<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECTOR SEVEN - Presensi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">SECTOR SEVEN</h1>
            <div class="datetime" id="datetime"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Status Lokasi -->
            <div class="location-status" id="locationStatus">
                <span class="status-icon">●</span>
                <span class="status-text">Memeriksa lokasi...</span>
            </div>

            <!-- Work Duration Card -->
            <div class="duration-card" id="durationCard" style="display: none;">
                <div class="duration-circle">
                    <svg width="200" height="200" viewBox="0 0 200 200">
                        <circle class="circle-bg" cx="100" cy="100" r="90"></circle>
                        <circle class="circle-progress" id="circleProgress" cx="100" cy="100" r="90" 
                                stroke-dasharray="565.48" stroke-dashoffset="565.48"></circle>
                    </svg>
                    <div class="duration-text">
                        <div class="duration-label">working hours</div>
                        <div class="duration-time" id="durationTime">00:00</div>
                    </div>
                </div>
                <div class="time-info">
                    <div class="time-item">
                        <div class="time-label">Check-In</div>
                        <div class="time-value" id="checkInTime">--:--</div>
                        <div class="time-status">Online</div>
                    </div>
                    <div class="time-item">
                        <div class="time-label">Check-Out</div>
                        <div class="time-value" id="checkOutTime">--:--</div>
                        <div class="time-status" id="checkOutStatus">--</div>
                    </div>
                </div>
            </div>

            <!-- Card Presensi -->
            <div class="card">
                <h2 class="card-title">Presensi Barista</h2>
                
                <!-- Dropdown Nama -->
                <div class="form-group">
                    <label for="baristaName">Pilih Nama</label>
                    <select id="baristaName" class="form-select">
                        <option value="">-- Pilih Barista --</option>
                        <option value="1">Dapek</option>
                        <option value="2">Siti</option>
                        <option value="3">Depon</option>
                        <option value="4">Abey</option>
                        <option value="5">Cler</option>
                    </select>
                </div>

                <!-- PIN Input -->
                <div class="form-group">
                    <label for="pin">PIN (4 Digit)</label>
                    <input 
                        type="password" 
                        id="pin" 
                        class="form-input" 
                        maxlength="4" 
                        placeholder="****"
                        inputmode="numeric"
                    >
                </div>

                <div class="button-group">
                    <button id="checkInBtn" class="btn btn-primary">Check In</button>
                    <button id="checkOutBtn" class="btn btn-secondary">Check Out</button>
                </div>

                <div id="message" class="message"></div>
            </div>

            <div class="card">
                <h3 class="card-subtitle">Riwayat Hari Ini</h3>
                <div id="todayHistory" class="history-list">
                    <p class="no-data">Memuat data...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 SECTOR SEVEN. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
