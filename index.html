<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECTOR SEVEN - Presensi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">SECTOR SEVEN</h1>
            <div class="datetime" id="datetime"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Status Lokasi -->
            <div class="location-status" id="locationStatus">
                <span class="status-icon">&bull;</span>
                <span class="status-text">Memeriksa lokasi...</span>
            </div>

            <!-- Card Presensi -->
            <div class="card">
                <h2 class="card-title">Presensi Barista</h2>
                
                <!-- Dropdown Nama -->
                <div class="form-group">
                    <label for="baristaName">Pilih Nama</label>
                    <select id="baristaName" class="form-select">
                        <option value="">-- Pilih Barista --</option>
                        <option value="1">Dapek</option>
                        <option value="2">Siti</option>
                        <option value="3">Depon</option>
                        <option value="4">Abey</option>
                        <option value="5">Cler</option>
                    </select>
                </div>

                <!-- PIN Input -->
                <div class="form-group">
                    <label for="pin">PIN (4 Digit)</label>
                    <input 
                        type="password" 
                        id="pin" 
                        class="form-input" 
                        maxlength="4" 
                        placeholder="****"
                        inputmode="numeric"
                    >
                </div>

                <div class="button-group">
                    <button id="checkInBtn" class="btn btn-primary">
                        Check In
                    </button>
                    <button id="checkOutBtn" class="btn btn-secondary">
                        Check Out
                    </button>
                </div>

                <div id="message" class="message"></div>
            </div>

            <div class="card">
                <h3 class="card-subtitle">Riwayat Hari Ini</h3>
                <div id="todayHistory" class="history-list">
                    <p class="no-data">Belum ada presensi hari ini</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 SECTOR SEVEN. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
